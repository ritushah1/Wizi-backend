server {
    server_name apitankhwapatra.tankhwapatra.co.in;
    client_max_body_size 500m;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        send_timeout 300;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/apitankhwapatra.tankhwapatra.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apitankhwapatra.tankhwapatra.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot MANUALLY CREATE
    ssl_dhparam /etc/letsencrypt/dhparam.pem; # managed by Certbot CHECK ACTUAL LOCATION OR GENERATE USING sudo openssl dhparam -out /etc/letsencrypt/dhparam.pem 4096

}
server {
    if ($host = apitankhwapatra.tankhwapatra.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name apitankhwapatra.tankhwapatra.co.in;
    return 404; # managed by Certbot
}