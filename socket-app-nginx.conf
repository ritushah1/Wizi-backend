server {
    server_name chat.tankhwapatra.co.in;
    client_max_body_size 500m;
    location / {
        proxy_pass http://localhost:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/chat.tankhwapatra.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chat.tankhwapatra.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot MANUALLY CREATE
    ssl_dhparam /etc/letsencrypt/dhparam.pem; # managed by Certbot CHECK ACTUAL LOCATION OR GENERATE USING sudo openssl 
}

server {
    if ($host = chat.tankhwapatra.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name chat.tankhwapatra.co.in;
    return 404; # managed by Certbot
}