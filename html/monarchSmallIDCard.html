<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Monarch Enterprises - ID Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            margin: 0;
        }

        .containerMain {
            max-width: 305px !important;
            max-height: 480px !important;
            width: 305px;
            height: 480px;
            position: relative;
            overflow: hidden;
            border-radius: 5px !important;
            margin: 20px !important;
        }

        .id-card {
            max-width: 305px !important;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 5px;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            page-break-inside: avoid;
        }

        .top-first {
            position: absolute;
            top: 0px;
            left: -25px;
            height: 10px !important;
            width: 20% !important;
            background: #611b16;
            transform: rotate(135deg);
            z-index: 5 !important;
        }

        .top-second {
            position: absolute;
            top: -5px;
            left: -50px;
            height: 40px !important;
            width: 50% !important;
            background: #8f2822;
            transform: rotate(135deg);
            z-index: 4 !important;
        }

        .top-third {
            position: absolute;
            top: 8px;
            left: -50px;
            height: 40px !important;
            width: 50% !important;
            background: #d12624;
            transform: rotate(135deg);
            z-index: 3 !important;
        }

        .top-fourth {
            position: absolute;
            top: 7px;
            left: 69px;
            height: 5px !important;
            width: 14% !important;
            background: #63201b;
            transform: rotate(135deg);
            z-index: 3 !important;
            overflow: hidden;
            border-top-right-radius: 100px;
            border-bottom-right-radius: 100px;
        }

        .top-fifth {
            position: absolute;
            top: 15px;
            left: 28px;
            height: 5px !important;
            width: 48% !important;
            background: #cc2c21;
            transform: rotate(135deg);
            z-index: 3 !important;
            overflow: hidden;
            border-top-right-radius: 100px;
            border-bottom-right-radius: 100px;
        }


        .bottom-first {
            position: absolute;
            bottom: 0px;
            right: -25px;
            height: 15px !important;
            width: 20% !important;
            background: #611b16;
            transform: rotate(135deg);
            z-index: 5 !important;
        }

        .bottom-second {
            position: absolute;
            bottom: -5px;
            right: -50px;
            height: 12px !important;
            width: 50% !important;
            background: #d12624;
            transform: rotate(135deg);
            z-index: 4 !important;
        }

        .bottom-third {
            position: absolute;
            bottom: -9px;
            right: 31px;
            height: 4px !important;
            width: 14% !important;
            background: #63201b;
            transform: rotate(135deg);
            z-index: 3 !important;
            overflow: hidden;
            border-bottom-left-radius: 100px;
            border-top-left-radius: 100px;
        }

        .bottom-fourth {
            position: absolute;
            bottom: 10px;
            right: 14px;
            height: 4px !important;
            width: 20% !important;
            background: #cc2c21;
            transform: rotate(135deg);
            z-index: 3 !important;
            overflow: hidden;
            border-bottom-left-radius: 100px;
            border-top-left-radius: 100px;
        }

        .companyLogoDiv {
            display: flex;
            justify-content: center;
            width: 28%;
        }

        .companyLogo {
            height: 60px;
            width: 60px;
        }

        .companyName {
            max-width: 150px;
            margin-top: 5px;
            text-align: center;
            line-height: 0.95 !important;
            color: #522018;
            font-weight: bolder;
            z-index: 10 !important;
        }

        .profileImageDiv {
            position: relative;
            margin-top: 27px;
            width: 128px;
            height: 161px;
        }

        .profileImage {
            height: 160px;
            width: 128px;
            object-fit: contain;
        }

        .employeeName {
            margin-top: 16px;
            font-size: 1.15rem;
            font-weight: bolder;
            color: #8c2420;
            font-family: "Montserrat", sans-serif;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .designation {
            margin-top: 12px;
            font-size: 0.875rem;
            font-weight: bolder;
            color: #383838;
            font-family: "Montserrat", sans-serif;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
        }

        .mobile {
            margin-top: 22px;
            font-size: 0.875rem;
            font-weight: bolder;
            color: #383838;
            font-family: "Montserrat", sans-serif;
        }

        .email {
            margin-top: 24px;
            font-size: 0.6rem;
            font-weight: bolder;
            color: #383838;
            font-family: "Montserrat", sans-serif;
        }

        .websiteFront {
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: bolder;
            color: #7e3238;
            font-family: "Montserrat", sans-serif;
        }

        .flex {
            display: flex;
        }

        .justify-center {
            justify-content: center;
        }

        .backgroundImage {
            background: url('./monarch_front.jpg') no-repeat center center;
            background-size: cover;
            opacity: 0.5;
            z-index: 0;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                /* Chrome/Safari */
                print-color-adjust: exact !important;
                /* Firefox */
            }

            .containerMain {
                width: 303px !important;
                position: relative;
                max-width: 303px !important;
            }

            @page {
                margin: 0px 0px !important;
            }

            .id-card {
                page-break-inside: avoid;
            }
        }

        .ml-40 {
            margin-left: 40px;
        }
    </style>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="row">
        {{#each tempData}}
        <div class="col-4">
            <div class="containerMain">
                <div class="id-card">
                    <div class="top-first"></div>
                    <div class="top-second"></div>
                    <div class="top-third"></div>
                    <div class="top-fourth"></div>
                    <div class="top-fifth"></div>
                    <div class="flex ml-40">
                        <div class="companyLogoDiv"></div>
                        <div>
                            {{#if this.idCardData.companyLogo}}
                            <img class="companyLogo"
                                src="{{ this.ApiURL }}uploads/company/logo/{{this.idCardData.companyLogo}}"
                                alt="Company Logo" />
                            {{/if}}
                        </div>
                    </div>
                    <div class="flex justify-center">
                        <div class="companyName">{{this.idCardData.companyName}}</div>
                    </div>
                    <div class="flex justify-center">
                        <div class="profileImageDiv">
                            <img class="profileImage"
                                src="{{this.ApiURL}}uploads/user/photo/{{ this.idCardData.userPhoto }}" alt="" />
                        </div>
                    </div>
                    <div class="flex justify-center">
                        <div class="employeeName">{{displayName}}</div>
                    </div>
                    <div class="flex justify-center">
                        <div class="designation">{{this.idCardData.designationName}}</div>
                    </div>
                    <div class="flex justify-center">
                        <div class="mobile">{{this.idCardData.userNumber}}</div>
                    </div>
                    <!-- <div class="flex justify-center">
                        <div class="email">E-mail: {{this.idCardData.companyEmail}}</div>
                    </div> -->
                    <div class="flex justify-center">
                        <div class="websiteFront">{{this.idCardData.companyWebsite}}</div>
                    </div>

                    <div class="bottom-first"></div>
                    <div class="bottom-second"></div>
                    <div class="bottom-third"></div>
                    <div class="bottom-fourth"></div>
                </div>
            </div>
        </div>
        {{/each}}
    </div>
</body>

</html>
